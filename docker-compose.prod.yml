version: "3.9"

services:
  # -----------------------------
  # Backend (Django + Gunicorn)
  # -----------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: prod_backend
    restart: unless-stopped
    command: >
      gunicorn core.wsgi:application
      --bind 0.0.0.0:8000
      --workers 2
      --threads 2
      --timeout 60
    env_file:
      - ./backend/.env.prod
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    expose:
      - "8000"
    depends_on:
      - mysql
      - redis
    networks:
      - app_network

  # -----------------------------
  # Nginx (Reverse Proxy + Frontend)
  # -----------------------------
  nginx:
    image: nginx:alpine
    container_name: prod_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - backend
    networks:
      - app_network

  # -----------------------------
  # MySQL
  # -----------------------------
  mysql:
    image: mysql:8.0
    container_name: prod_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    env_file:
      - ./backend/.env.prod
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    networks:
      - app_network

  # -----------------------------
  # Redis
  # -----------------------------
  redis:
    image: redis:7-alpine
    container_name: prod_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - app_network

  # -----------------------------
  # Celery Worker
  # -----------------------------
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: prod_celery_worker
    restart: unless-stopped
    command: celery -A core worker -l info
    env_file:
      - ./backend/.env.prod
    depends_on:
      - backend
      - redis
    networks:
      - app_network

  # -----------------------------
  # Celery Beat
  # -----------------------------
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: prod_celery_beat
    restart: unless-stopped
    command: celery -A core beat -l info
    env_file:
      - ./backend/.env.prod
    depends_on:
      - backend
      - redis
    networks:
      - app_network

# -----------------------------
# Volumes
# -----------------------------
volumes:
  mysql_data:
  redis_data:
  static_volume:
  media_volume:

# -----------------------------
# Network
# -----------------------------
networks:
  app_network:
    driver: bridge
