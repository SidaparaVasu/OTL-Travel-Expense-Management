# version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: prod_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-orange_tata_travel}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-orange@505}
      MYSQL_USER: ${DB_USER:-orange}
      MYSQL_PASSWORD: ${DB_PASSWORD:-orange@505}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-orange@505}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: prod_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Backend
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile.prod.new
      args:
        _LOCATION_API_KEY: ${_LOCATION_API_KEY}
        _LOCATION_API_BASE_URL: ${_LOCATION_API_BASE_URL}
        _GEODB_API_KEY: ${_GEODB_API_KEY}
        _GEODB_BASE_URL: ${_GEODB_BASE_URL}
        SSO_AES_KEY: ${SSO_AES_KEY}
        SSO_AES_IV: ${SSO_AES_IV}
    container_name: prod_backend
    restart: unless-stopped
    # command: python manage.py runserver 0.0.0.0:8000
    volumes:
      # - ./Backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - ./Backend/.env.prod
    environment:
      - ENVIRONMENT=production
      - DEBUG=True
      - DB_HOST=mysql
      - DB_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DJANGO_ALLOWED_HOSTS=${ALLOWED_HOSTS}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network

  # Celery Worker
  celery_worker:
    build:
      context: ./Backend
      dockerfile: Dockerfile.prod.new
    container_name: prod_celery_worker
    restart: unless-stopped
    # command: celery -A Main worker -l info
    command: celery -A Main worker -l info -Q default,notifications --concurrency=1
    volumes:
      - ./Backend:/app
    env_file:
      - ./Backend/.env.prod
    environment:
      - ENVIRONMENT=production
      - DEBUG=True
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=orange
      - DB_PASSWORD=orange@505
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DJANGO_SETTINGS_MODULE=Main.settings
    depends_on:
      - mysql
      - redis
      - backend
    networks:
      - app_network

  # Celery Beat (Scheduler)
  celery_beat:
    build:
      context: ./Backend
      dockerfile: Dockerfile.prod.new
    container_name: prod_celery_beat
    restart: unless-stopped
    command: celery -A Main beat -l info
    volumes:
      - ./Backend:/app
    env_file:
      - ./Backend/.env.prod
    environment:
      - ENVIRONMENT=production
      - DEBUG=True
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=orange
      - DB_PASSWORD=orange@505
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DJANGO_SETTINGS_MODULE=Main.settings
    depends_on:
      - mysql
      - redis
      - backend
    networks:
      - app_network

  # React Frontend (Static Build)
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile.prod
    container_name: prod_frontend
    restart: unless-stopped
    # No command needed (Dockerfile has CMD nginx)
    # No volumes needed (Code is baked into image)
    ports:
       - "5173:5173" # Optional: For debugging access if needed, mapping host 5173 to container 80
    env_file:
      - ./Frontend/.env.prod
    networks:
      - app_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: prod_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - backend
      - frontend
    networks:
      - app_network

volumes:
  mysql_data:
  redis_data:
  static_volume:
  media_volume:

networks:
  app_network:
    driver: bridge