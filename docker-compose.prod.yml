version: "3.9"

services:
  # -----------------------------
  # Backend (Django + Gunicorn)
  # -----------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: travelexpensepro_backend:latest
    container_name: prod_backend
    restart: unless-stopped
    command: >
      gunicorn Main.wsgi:application
      --bind 0.0.0.0:8000
      --workers 3
      --threads 2
      --timeout 120
    environment:
      - ENVIRONMENT=production
    env_file:
      - ./backend/.env.prod
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    expose:
      - "8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network

  # -----------------------------
  # Nginx (Reverse Proxy + Frontend)
  # -----------------------------
  nginx:
    image: nginx:alpine
    container_name: prod_nginx
    restart: unless-stopped
    ports:
      - "5173:80"
      - "443:443"
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./Frontend/dist:/usr/share/nginx/html:ro
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - backend
    networks:
      - app_network

  # -----------------------------
  # MySQL
  # -----------------------------
  mysql:
    image: mysql:8.0
    container_name: prod_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      - MYSQL_DATABASE=${DB_NAME:-orange_tata_travel}
      - MYSQL_USER=${DB_USER:-orange}
      - MYSQL_PASSWORD=${DB_PASSWORD:-orange@505}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-orange@505}
    env_file:
      - ./backend/.env.prod
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306"
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${DB_PASSWORD:-app123}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------
  # Redis
  # -----------------------------
  redis:
    image: redis:7-alpine
    container_name: prod_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------
  # Celery Worker
  # -----------------------------
  celery_worker:
    image: travelexpensepro_backend:latest
    container_name: prod_celery_worker
    restart: unless-stopped
    command: celery -A Main worker -l info
    environment:
      - ENVIRONMENT=production
    env_file:
      - ./backend/.env.prod
    depends_on:
      - backend
      - redis
    networks:
      - app_network

  # -----------------------------
  # Celery Beat
  # -----------------------------
  celery_beat:
    image: travelexpensepro_backend:latest
    container_name: prod_celery_beat
    restart: unless-stopped
    command: celery -A Main beat -l info
    environment:
      - ENVIRONMENT=production
    env_file:
      - ./backend/.env.prod
    depends_on:
      - backend
      - redis
    networks:
      - app_network

  # -----------------------------
  # Database Backup (Sidecar)
  # -----------------------------
  db_backup:
    image: mysql:8.0
    container_name: prod_db_backup
    restart: unless-stopped
    volumes:
      - ./docker/mysql/backup.sh:/usr/local/bin/backup.sh:ro
      - db_backups:/backups
    environment:
      - MYSQL_DATABASE=${DB_NAME:-orange_tata_travel}
      - MYSQL_USER=${DB_USER:-orange}
      - MYSQL_PASSWORD=${DB_PASSWORD:-orange@505}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app_network
    # Run the backup script every 24 hours (86400 seconds)
    entrypoint: ["sh", "-c", "while true; do /bin/bash /usr/local/bin/backup.sh; sleep 86400; done"]

# -----------------------------
# Volumes
# -----------------------------
volumes:
  mysql_data:
  redis_data:
  static_volume:
  media_volume:
  db_backups:

# -----------------------------
# Network
# -----------------------------
networks:
  app_network:
    driver: bridge
